
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-cost-infrastructure-optimizer"
version = "0.1.0"
description = "Production-grade AWS cost and infrastructure optimizer."
requires-python = ">=3.12"

dependencies = [
    "boto3>=1.35,<2.0",
    "openai>=1.0,<2.0",
    "python-dotenv>=1.0,<2.0",
    "rich>=13.0,<15.0",
    "PyMySQL>=1.1,<2.0",
    "opensearch-py>=2.7,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["output*"]
