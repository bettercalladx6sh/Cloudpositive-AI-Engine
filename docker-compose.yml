services:
  mysql:
    image: mysql:8.4
    container_name: cost-optimizer-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cost_optimizer
      MYSQL_USER: optimizer
      MYSQL_PASSWORD: optimizer_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "3307:3306"
    volumes:
      - cost_optimizer_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root",
          "-proot_dev_password",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  cost_optimizer_mysql_data:
